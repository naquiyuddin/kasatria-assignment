<!DOCTYPE html>
<html>
<head>
    <title>Kasatria 3D Data Viewer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #111; }
        
        /* Login Overlay */
        #login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(127,255,255,0.3);
            z-index: 20;
            min-width: 320px;
            box-shadow: 0 0 40px rgba(0,255,255,0.1);
        }
        #login-container h2 { color: #8ff; margin-top: 0; }
        #login-container p { color: #aaa; font-size: 14px; }
        #login-status { color: #8ff; margin-top: 12px; font-size: 14px; }
        
        #g-signin2 button {
            padding: 12px 30px;
            font-size: 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #g-signin2 button:hover { background: #357ae8; }

        /* 3D Container */
        #container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        /* Controls */
        #menu {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 10;
            display: none;
        }
        #menu button {
            color: rgba(127,255,255,0.75);
            background: transparent;
            outline: 1px solid rgba(127,255,255,0.75);
            border: 0px;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        #menu button:hover {
            background-color: rgba(0,255,255,0.2);
            color: #fff;
        }
        #menu button:active {
            color: #000;
            background-color: rgba(0,255,255,0.75);
        }
        #menu button.active {
            background-color: rgba(0,255,255,0.3);
            color: #fff;
        }

        /* Tile Styles */
        .element {
            width: 130px;
            height: 170px;
            box-shadow: 0px 0px 15px rgba(0,255,255,0.3);
            border: 1px solid rgba(127,255,255,0.2);
            font-family: Helvetica, sans-serif;
            text-align: center;
            cursor: default;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;
        }
        .element:hover {
            box-shadow: 0px 0px 30px rgba(0,255,255,0.6);
            border: 1px solid rgba(127,255,255,0.6);
            transform: scale(1.05) !important;
        }
        .element img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.3);
            margin-bottom: 5px;
        }
        .element .name { font-weight: bold; font-size: 13px; margin: 2px 0; }
        .element .details { font-size: 11px; opacity: 0.8; line-height: 1.4; }
        .element .networth { 
            font-weight: bold; 
            font-size: 12px; 
            margin-top: 4px; 
            background: rgba(0,0,0,0.3); 
            padding: 2px 10px; 
            border-radius: 4px;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(127,255,255,0.5);
            font-size: 12px;
            z-index: 10;
            font-family: Arial, sans-serif;
        }
        #info a { color: #8ff; }
    </style>
</head>
<body>

    <div id="info"><a href="https://threejs.org" target="_blank">three.js</a> - Kasatria Data Viewer</div>

    <!-- Login Overlay -->
    <div id="login-container">
        <h2>🔐 Sign In With Google</h2>
        <p>Please sign in to view the 3D data visualization</p>
        <div id="g-signin2"></div>
        <p id="login-status"></p>
    </div>

    <!-- 3D Container -->
    <div id="container"></div>

    <!-- Controls -->
    <div id="menu">
        <button id="table">📊 TABLE</button>
        <button id="sphere">🌍 SPHERE</button>
        <button id="helix">🧬 HELIX</button>
        <button id="grid">📦 GRID</button>
    </div>

    <!-- Google APIs -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // --- Imports ---
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        // ============================================================
        // YOUR CREDENTIALS
        // ============================================================
        const API_KEY = 'AIzaSyD0F_8pS2bQ-OehLBrET7lNQ_uPP3sAGzs';
        const SPREADSHEET_ID = '15CS9uiUWXtgUnnEN7mbCCUUnozf8bSOxQpWGe7hTPB8';
        const CLIENT_ID = '47598662292-g2hb0rafkns7d15f6t3a8t4rugq3gi9n.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets.readonly';

        // ============================================================
        // STATE
        // ============================================================
        let peopleData = [];
        let scene, camera, renderer, controls;
        const objects = [];
        const targets = { table: [], sphere: [], helix: [], grid: [] };
        let currentLayout = 'table';

        // ============================================================
        // THREE.JS SETUP
        // ============================================================
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(0, 0, 2500);
            camera.lookAt(0, 0, 0);

            renderer = new CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.minDistance = 500;
            controls.maxDistance = 6000;
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // ============================================================
        // CREATE TILE
        // ============================================================
        function createTile(person) {
            let bgColor = '#dc3545';
            if (person.netWorth > 200000) bgColor = '#28a745';
            else if (person.netWorth >= 100000) bgColor = '#fd7e14';

            const element = document.createElement('div');
            element.className = 'element';
            element.style.backgroundColor = bgColor;

            const photoHTML = person.photo && person.photo.startsWith('http')
                ? `<img src="${person.photo}" alt="${person.name}">`
                : `<div style="width:50px;height:50px;border-radius:50%;background:#555;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;">?</div>`;

            element.innerHTML = `
                ${photoHTML}
                <div class="name">${person.name}</div>
                <div class="details">Age: ${person.age} | ${person.country}</div>
                <div class="details">${person.interest}</div>
                <div class="networth">${person.netWorthString}</div>
            `;

            return new CSS3DObject(element);
        }

        // ============================================================
        // BUILD LAYOUT TARGETS
        // ============================================================
        function buildTargets() {
            const total = peopleData.length;
            
            // --- TABLE (20x10) ---
            targets.table = [];
            const cols = 20;
            const rows = 10;
            const spacingX = 150;
            const spacingZ = 150;
            for (let i = 0; i < total; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const obj = new THREE.Object3D();
                obj.position.x = (col - cols/2) * spacingX;
                obj.position.z = (row - rows/2) * spacingZ;
                obj.position.y = 0;
                targets.table.push(obj);
            }

            // --- SPHERE ---
            targets.sphere = [];
            const radius = 800;
            for (let i = 0; i < total; i++) {
                const phi = Math.acos(-1 + (2 * i + 1) / total);
                const theta = Math.sqrt(total * Math.PI) * phi;
                const obj = new THREE.Object3D();
                obj.position.setFromSphericalCoords(radius, phi, theta);
                const vec = obj.position.clone().multiplyScalar(2);
                obj.lookAt(vec);
                targets.sphere.push(obj);
            }

            // --- DOUBLE HELIX ---
            targets.helix = [];
            const helixRadius = 700;
            const heightTotal = 800;
            const turns = 4;
            for (let i = 0; i < total; i++) {
                const t = i / total;
                const angle = t * Math.PI * 2 * turns;
                const strandOffset = (i % 2 === 0) ? 0 : Math.PI;
                const obj = new THREE.Object3D();
                obj.position.x = helixRadius * Math.cos(angle + strandOffset);
                obj.position.z = helixRadius * Math.sin(angle + strandOffset);
                obj.position.y = (t - 0.5) * heightTotal;
                const vec = obj.position.clone();
                vec.y = 0;
                obj.lookAt(vec);
                targets.helix.push(obj);
            }

            // --- GRID (5x4x10) ---
            targets.grid = [];
            const gridW = 5;
            const gridH = 4;
            const gridD = 10;
            const spacingGrid = 160;
            for (let i = 0; i < total; i++) {
                const w = i % gridW;
                const h = Math.floor(i / gridW) % gridH;
                const d = Math.floor(i / (gridW * gridH));
                const obj = new THREE.Object3D();
                obj.position.x = (w - gridW/2) * spacingGrid;
                obj.position.y = (h - gridH/2) * spacingGrid;
                obj.position.z = (d - gridD/2) * spacingGrid;
                targets.grid.push(obj);
            }
        }

        // ============================================================
        // TRANSFORM (Animate to Layout)
        // ============================================================
        function transform(targetsArray, duration = 1500) {
            if (!objects.length || !targetsArray.length) return;

            const startTime = Date.now();
            
            // Store start positions
            const startPositions = objects.map(obj => obj.position.clone());
            const startRotations = objects.map(obj => obj.rotation.clone());

            function animateTransform() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function (ease in-out cubic)
                const ease = progress < 0.5 
                    ? 4 * progress * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                for (let i = 0; i < objects.length && i < targetsArray.length; i++) {
                    const obj = objects[i];
                    const target = targetsArray[i];
                    
                    obj.position.lerpVectors(startPositions[i], target.position, ease);
                    
                    // Smooth rotation interpolation
                    obj.rotation.x = startRotations[i].x + (target.rotation.x - startRotations[i].x) * ease;
                    obj.rotation.y = startRotations[i].y + (target.rotation.y - startRotations[i].y) * ease;
                    obj.rotation.z = startRotations[i].z + (target.rotation.z - startRotations[i].z) * ease;
                }

                renderer.render(scene, camera);

                if (progress < 1) {
                    requestAnimationFrame(animateTransform);
                }
            }

            animateTransform();
        }

        // ============================================================
        // CREATE ALL TILES
        // ============================================================
        function createTiles() {
            // Remove old objects
            objects.forEach(obj => scene.remove(obj));
            objects.length = 0;

            for (let i = 0; i < peopleData.length; i++) {
                const tile = createTile(peopleData[i]);
                // Start at random position for entrance effect
                tile.position.set(
                    Math.random() * 4000 - 2000,
                    Math.random() * 4000 - 2000,
                    Math.random() * 4000 - 2000
                );
                scene.add(tile);
                objects.push(tile);
            }

            buildTargets();
            
            // Show controls after tiles are created
            document.getElementById('menu').style.display = 'block';
            
            // Default to table layout
            setTimeout(() => {
                transform(targets.table, 2000);
            }, 300);
        }

        // ============================================================
        // DATA FETCHING
        // ============================================================
        function fetchSheetData(accessToken) {
            const status = document.getElementById('login-status');
            status.textContent = 'Loading data from Google Sheet...';

            gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"],
            }).then(() => {
                gapi.client.setToken({ access_token: accessToken });
                return gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: 'Data Template!A2:F',
                });
            }).then((response) => {
                const rows = response.result.values;
                if (rows && rows.length > 0) {
                    peopleData = rows.map(row => ({
                        name: row[0] || 'Unknown',
                        photo: row[1] || '',
                        age: row[2] || 'N/A',
                        country: row[3] || 'N/A',
                        interest: row[4] || 'N/A',
                        netWorthString: row[5] || '$0',
                        netWorth: parseFloat(row[5] ? row[5].replace(/[$,]/g, '') : 0),
                    }));

                    document.getElementById('login-container').style.display = 'none';
                    createTiles();
                } else {
                    status.textContent = 'No data found. Check sheet range.';
                }
            }).catch((error) => {
                console.error('Error fetching data:', error);
                status.textContent = 'Error loading data. Check console.';
            });
        }

        // ============================================================
        // GOOGLE SIGN-IN
        // ============================================================
        function initGoogleSignIn() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.error) {
                        document.getElementById('login-status').textContent = 'Login failed. Try again.';
                        return;
                    }
                    fetchSheetData(tokenResponse.access_token);
                },
            });

            document.getElementById('g-signin2').innerHTML = `
                <button onclick="window.handleSignIn()">Sign In with Google</button>
            `;

            window.handleSignIn = function() {
                client.requestAccessToken();
            };
        }

        // ============================================================
        // LAYOUT BUTTON HANDLERS
        // ============================================================
        function setupButtons() {
            const buttonMap = {
                'table': targets.table,
                'sphere': targets.sphere,
                'helix': targets.helix,
                'grid': targets.grid,
            };

            document.querySelectorAll('#menu button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.id;
                    if (buttonMap[id]) {
                        // Remove active class from all buttons
                        document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        transform(buttonMap[id], 1500);
                    }
                });
            });

            // Set initial active state
            document.getElementById('table').classList.add('active');
        }

        // ============================================================
        // START
        // ============================================================
        initScene();
        animate();
        setupButtons();
        gapi.load('client', initGoogleSignIn);
    </script>
</body>
</html>
