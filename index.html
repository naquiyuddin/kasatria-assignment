<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasatria 3D Data Viewer</title>
    <style>
        /* --- Reset & Base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #111122;
            overflow: hidden;
            color: white;
        }

        /* --- Login Overlay --- */
        #login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(127, 255, 255, 0.3);
            text-align: center;
            z-index: 20;
            min-width: 320px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
        }
        #login-container h2 {
            color: #8ff;
            margin-bottom: 8px;
        }
        #login-container p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #login-status {
            color: #8ff;
            margin-top: 12px;
            font-size: 14px;
        }
        #g-signin2 button {
            padding: 12px 30px;
            font-size: 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #g-signin2 button:hover {
            background: #357ae8;
        }

        /* --- 3D Container --- */
        #container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- Bottom Controls --- */
        #menu {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: none;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 18px;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            flex-wrap: wrap;
            justify-content: center;
        }
        #menu button {
            color: rgba(127, 255, 255, 0.8);
            background: transparent;
            border: 1px solid rgba(127, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        #menu button:hover {
            background: rgba(0, 255, 255, 0.15);
            color: #fff;
        }
        #menu button.active {
            background: rgba(0, 255, 255, 0.25);
            color: #fff;
            border-color: #8ff;
        }

        /* --- Tile Styles --- */
        .element {
            width: 130px;
            height: 170px;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: default;
        }
        .element:hover {
            transform: scale(1.08) !important;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            border-color: rgba(127, 255, 255, 0.6);
        }
        .element img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 4px;
        }
        .element .name {
            font-weight: bold;
            font-size: 13px;
            line-height: 1.2;
        }
        .element .detail {
            font-size: 11px;
            opacity: 0.85;
            line-height: 1.3;
        }
        .element .networth {
            font-weight: bold;
            font-size: 12px;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 10px;
            border-radius: 4px;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(127, 255, 255, 0.4);
            font-size: 12px;
            z-index: 10;
            font-family: Arial, sans-serif;
        }
        #info a {
            color: #8ff;
        }
    </style>
</head>
<body>

    <!-- Top Info -->
    <div id="info"><a href="https://threejs.org" target="_blank">three.js</a> – Kasatria Data Viewer</div>

    <!-- Login Overlay -->
    <div id="login-container">
        <h2>🔐 Sign In With Google</h2>
        <p>Please sign in to view the 3D visualization</p>
        <div id="g-signin2"></div>
        <p id="login-status"></p>
    </div>

    <!-- 3D Container -->
    <div id="container"></div>

    <!-- Bottom Controls -->
    <div id="menu">
        <button data-layout="table">📊 Table (20×10)</button>
        <button data-layout="sphere">🌍 Sphere</button>
        <button data-layout="helix">🧬 Double Helix</button>
        <button data-layout="grid">📦 Grid (5×4×10)</button>
    </div>

    <!-- ===== LOAD SCRIPTS ===== -->
    <!-- Google APIs -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Your Main App -->
    <script type="module" src="app.js"></script>
</body>
</html>
